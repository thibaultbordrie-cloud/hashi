name: ci

on:
  push:
  pull_request:
  # Once a week, one real lookup tells whether a catalogue changed its answers.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

env:
  KOTLIN_VERSION: "2.2.21"
  # SHA-256 of kotlin-compiler-2.2.21.zip from JetBrains' GitHub release: the build stops if it differs.
  KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin compiler (checked by SHA-256)
        run: |
          curl -fsSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - name: Build and test (warnings are errors)
        run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/*.jar

  # The jar runs anywhere Java 21 runs: the same offline tests on three systems.
  run:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build
      - name: Tests
        run: java -cp build/hashi-tests.jar hashi.CheckKt
      - name: The command line, offline, from the recorded answers
        shell: bash
        run: java -jar build/hashi.jar --offline --cache src/test/fixtures --lang en 9782020134736

  # Real catalogues, real network: only on the weekly schedule or by hand.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build
      - name: One lookup in each catalogue
        run: |
          java -jar build/hashi.jar --no-cache --json 9782020134736 > answer.json
          grep -q '"wikidata":"Q751348"' answer.json
          grep -q '"NDL"' answer.json
